<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="version" content="20260511_v11_local">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="环球伙拼送货">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="manifestLink" href="manifest.json">
<title>环球伙拼 · 送货排班</title>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3250;
  --accent:#4f8ef7; --green:#38c9a0; --red:#f76b6b; --yellow:#f7c94f;
  --text:#e8eaf6; --mut:#7b82a8; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text',sans-serif;font-size:14px;display:flex;flex-direction:column;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));}
.app-title{font-size:15px;font-weight:700;}
.app-sub{font-size:11px;color:var(--mut);}
.header-right{margin-left:auto;}
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;cursor:pointer;border:none;background:none;color:var(--mut);font-size:11px;transition:color .2s;font-family:inherit;}
.nav-item .ni{font-size:20px;line-height:1;}
.nav-item.active{color:var(--accent);}
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page.active{display:flex;flex-direction:column;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;text-align:center;}
.modal h2{font-size:20px;margin-bottom:8px;}
.modal p{color:var(--mut);font-size:13px;margin-bottom:20px;line-height:1.6;}
.modal input{width:100%;background:var(--surface2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;padding:14px 16px;outline:none;text-align:center;font-family:inherit;margin-bottom:14px;transition:border-color .2s;}
.modal input:focus{border-color:var(--accent);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.card-header{padding:11px 14px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-bottom:1px solid var(--border);}
.drivers-row{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.driver-tag{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.driver-tag .rm{cursor:pointer;opacity:.6;font-size:16px;line-height:1;}
.driver-tag .rm:hover{opacity:1;}
.add-driver-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 12px;outline:none;font-family:inherit;width:130px;}
.add-driver-input:focus{border-color:var(--accent);}
textarea,input[type=text],input[type=date],input[type=number]{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:10px 12px;outline:none;font-family:inherit;transition:border-color .2s;}
textarea{width:100%;resize:vertical;}
input[type=text]:focus,input[type=date]:focus{border-color:var(--accent);}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:#3a7af0;}
.btn-green{background:var(--green);color:#0f1117;}
.btn-green:hover:not(:disabled){background:#2db890;}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:rgba(247,107,107,.12);color:var(--red);border:1px solid rgba(247,107,107,.3);}
.btn-full{width:100%;margin-top:10px;}
.btn-sm{padding:7px 12px;font-size:12px;}
.status-bar{padding:10px 14px;font-size:12px;color:var(--mut);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;min-height:38px;}
.spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);}
.stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mut);}
.stat-pill b{color:var(--text);}
.driver-route-tab{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;}
.drt{padding:9px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;}
.drt.active{color:var(--accent);border-bottom-color:var(--accent);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--surface2);padding:9px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,.02);}
.seq-num{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.cash-badge{background:rgba(247,201,79,.15);color:var(--yellow);border:1px solid rgba(247,201,79,.3);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;}
.nav-btn{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
.action-bar{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);}
.empty-state{text-align:center;padding:50px 20px;color:var(--mut);}
.empty-state .icon{font-size:36px;margin-bottom:10px;}
.driver-bar{background:linear-gradient(135deg,var(--accent),#7c5cf7);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.driver-bar span{font-weight:700;font-size:14px;}
.stop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:10px 14px;overflow:hidden;transition:opacity .3s;}
.stop-card.done{opacity:.45;}
.stop-header{padding:11px 14px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-bottom:1px solid var(--border);}
.stop-body{padding:14px;}
.stop-info{font-size:13px;line-height:2;margin-bottom:12px;}
.stop-info a{text-decoration:none;color:var(--accent);}
.stop-actions{display:flex;gap:8px;margin-bottom:12px;}
.photo-area{margin-top:8px;}
.photo-area label{font-size:12px;color:var(--mut);margin-bottom:6px;}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.photo-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;}
.photo-upload-btn{width:60px;height:60px;border:2px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mut);cursor:pointer;position:relative;transition:border-color .2s;}
.photo-upload-btn:hover{border-color:var(--accent);color:var(--accent);}
.photo-upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.cash-input-area{margin-top:10px;padding:12px 14px;background:rgba(247,201,79,.07);border:1px solid rgba(247,201,79,.25);border-radius:8px;}
.cash-input-area label{color:var(--yellow);font-size:12px;font-weight:600;margin-bottom:6px;}
.cash-input-row{display:flex;align-items:center;gap:8px;}
.cash-input-row span{font-size:16px;font-weight:700;color:var(--yellow);}
.cash-amount-input{background:var(--surface2);border:1px solid rgba(247,201,79,.4);border-radius:8px;color:var(--yellow);font-size:18px;font-weight:700;padding:8px 12px;outline:none;width:130px;text-align:right;font-family:inherit;}
.cash-amount-input:focus{border-color:var(--yellow);}
.cash-saved-badge{font-size:12px;color:var(--yellow);opacity:.7;}
.cash-summary{background:linear-gradient(135deg,rgba(247,201,79,.15),rgba(247,201,79,.05));border:1px solid rgba(247,201,79,.3);border-radius:var(--radius);margin:0 14px 14px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.cash-summary-icon{font-size:28px;}
.cash-summary-label{font-size:12px;color:var(--mut);}
.cash-summary-amount{font-size:26px;font-weight:800;color:var(--yellow);line-height:1;}
.cash-summary-detail{font-size:11px;color:var(--mut);margin-top:2px;}
.manual-entry-row{display:flex;gap:6px;align-items:center;padding:6px 14px;flex-wrap:wrap;}
.manual-entry-row input{flex:1;min-width:80px;font-size:12px;padding:7px 8px;}
.manual-entry-row .btn-sm{padding:5px 10px;font-size:11px;}
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:0 14px 10px;padding:14px;cursor:pointer;transition:border-color .2s;}
.history-item:hover{border-color:var(--accent);}
.history-date{font-size:13px;font-weight:700;}
.history-meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.8;}
.history-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.tag{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mut);}
.detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
.detail-overlay.open{display:block;}
.detail-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;padding-top:max(14px,env(safe-area-inset-top));}
.detail-stop{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:10px 14px;padding:14px;}
.detail-stop-meta{font-size:12px;color:var(--mut);line-height:2;margin-top:6px;}
.detail-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.detail-photo{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;display:none;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:8px;}
.lightbox-close{position:absolute;top:20px;right:20px;font-size:32px;color:#fff;cursor:pointer;line-height:1;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:400;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.date-driver-row{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-shrink:0;}
.driver-chip{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;}
.color-0{background:#4f8ef7;} .color-1{background:#38c9a0;} .color-2{background:#f7c94f;}
.color-3{background:#f76b6b;} .color-4{background:#a78bfa;} .color-5{background:#fb923c;}
</style>
</head>
<body>
<div class="modal-overlay" id="driverGate">
  <div class="modal">
    <div style="font-size:44px;margin-bottom:12px">&#x1F69A;</div>
    <h2>司机登录</h2>
    <p>输入您的姓名才能开始使用。<br>每次送货记录与您的名字绑定。</p>
    <input type="text" id="driverNameInput" placeholder="输入司机姓名" maxlength="20"
      oninput="checkDriverName()" onkeydown="if(event.key==='Enter')confirmDriver()">
    <button class="btn btn-primary btn-full" id="driverConfirmBtn" onclick="confirmDriver()" disabled>确认并进入 &rarr;</button>
  </div>
</div>

<div class="app-header">
  <span style="font-size:20px">&#x1F69A;</span>
  <div><div class="app-title">环球伙拼送货</div><div class="app-sub">v11 &middot; 纯本地引擎 &middot; 零API依赖</div></div>
  <div class="header-right">
    <div class="driver-chip" onclick="changeDriver()" id="driverChip" style="display:none">
      &#x1F464; <span id="driverChipName"></span>
    </div>
  </div>
</div>

<div class="page active" id="page-plan">
  <div class="date-driver-row" id="dateDriverRow" style="display:none">
    <span style="font-size:12px;color:var(--mut)">&#x1F4C5;</span>
    <input type="date" id="deliveryDate" style="max-width:165px;flex:none">
  </div>
  <div class="card" style="margin:8px 12px 0;flex-shrink:0;display:none" id="driversCard">
    <div class="card-header" style="padding:8px 14px">
      <span class="seq-num color-0" style="color:#fff">&#x1F465;</span>
      <span style="font-weight:700">司机列表</span>
      <span style="font-size:12px;color:var(--mut);margin-left:6px">（多司机自动分配路线）</span>
    </div>
    <div class="drivers-row" id="driverTagsRow" style="padding:8px 14px 4px"></div>
    <div style="padding:6px 14px 10px;display:flex;gap:8px;align-items:center">
      <input class="add-driver-input" type="text" id="newDriverInput" placeholder="添加司机姓名"
        maxlength="20" onkeydown="if(event.key==='Enter')addDriver()">
      <button class="btn btn-secondary btn-sm" onclick="addDriver()">＋ 添加</button>
    </div>
  </div>
  <div class="card" style="margin:8px 12px 8px;flex-shrink:0">
    <div class="card-header" style="padding:8px 14px">
      <span class="seq-num color-0" style="color:#fff">1</span>
      <span style="font-weight:700">录入客户信息</span>
    </div>
    <div style="padding:14px 14px 0">
      <label>粘贴客户信息（任意格式，一行一个客户）</label>
      <textarea id="rawInput" rows="5" placeholder="支持多种格式，每行一个客户：&#10;张三，3件，3 Oak St Doncaster，0412345678，下午2点，转账&#10;李四 2件 25 Smith Rd Box Hill 0423456789 现金&#10;王五|5件|10 Main St Glen Waverley|0434567890|随时"></textarea>
      <button class="btn btn-primary btn-full" id="parseTextBtn" onclick="doParseText()">&#x26A1; 本地解析 &amp; 优化路线</button>
    </div>
    <div style="padding:0 14px 14px">
      <div style="display:flex;align-items:center;gap:8px;margin:10px 0 6px">
        <span style="font-size:12px;color:var(--mut);font-weight:600">或手动逐行录入</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div id="manualTable" style="margin-bottom:8px"></div>
      <button class="btn btn-secondary btn-sm" onclick="addManualRow()">＋ 添加一行</button>
    </div>
    <div class="status-bar" id="statusBar">请先完成司机登录...</div>
  </div>
  <div id="routeCard" style="margin:0 12px 12px;display:none">
    <div class="card">
      <div class="card-header">
        <span class="seq-num color-1" style="color:#0f1117">2</span>
        <span style="font-weight:700">最优路线</span>
      </div>
      <div class="toolbar">
        <div class="stat-pill">共 <b id="statTotal">0</b> 单</div>
        <div class="stat-pill"><b id="statPkgs">0</b> 件</div>
        <div class="stat-pill">&#x1F4B0; 现金 <b id="statCash">0</b> 单</div>
        <div class="stat-pill">~<b id="statKm">0</b> km</div>
        <div class="stat-pill">~<b id="statMin">0</b> 分钟</div>
      </div>
      <div class="driver-route-tab" id="driverRouteTabs"></div>
      <div class="table-wrap" id="tableWrap"></div>
      <div class="action-bar">
        <button class="btn btn-green btn-sm" onclick="openAllMaps()">&#x1F5FA; Google Maps 导航</button>
        <button class="btn btn-primary btn-sm" onclick="startDelivery()">&#x1F69A; 开始送货</button>
        <button class="btn btn-secondary btn-sm" onclick="copyDriverSheet()">&#x1F4CB; 复制表格</button>
        <button class="btn btn-danger btn-sm" onclick="clearPlan()">&#x2715; 清空</button>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-driver">
  <div class="driver-bar" id="driverBar">
    <span>&#x1F69A;</span><span id="driverBarName">司机模式</span>
    <span style="margin-left:auto;font-size:12px;opacity:.8" id="driverBarDate"></span>
  </div>
  <div id="driverStops" style="padding-bottom:20px"></div>
</div>

<div class="page" id="page-history">
  <div style="padding:14px 16px 8px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px">&#x1F4E6; 历史送货记录</div>
  <div id="historyList" style="padding-bottom:20px"></div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" onclick="switchPage('plan')" id="nav-plan"><span class="ni">&#x1F4CB;</span>排班</button>
  <button class="nav-item" onclick="switchPage('driver')" id="nav-driver"><span class="ni">&#x1F69A;</span>送货</button>
  <button class="nav-item" onclick="switchPage('history')" id="nav-history"><span class="ni">&#x1F550;</span>历史</button>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <button class="btn btn-secondary btn-sm" onclick="closeDetail()">&larr; 返回</button>
    <span style="font-weight:700;font-size:14px" id="detailTitle"></span>
  </div>
  <div id="detailContent" style="padding-bottom:40px"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&#x2715;</span>
  <img id="lightboxImg" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script>

function openDB(){

    req.onupgradeneeded=e=>{

      if(!d.objectStoreNames.contains('sessions'))

  });
}

function geocodeLocal(address){
  const al=address.toLowerCase().trim();
  const pc=al.match(/\b(3\d{3})\b/);
  if(pc&&POSTCODE_TO_SUBURB[pc[1]]){
    const s=POSTCODE_TO_SUBURB[pc[1]];
    if(SUBURB_DB[s])return{lat:SUBURB_DB[s][0],lng:SUBURB_DB[s][1],ok:true};
  }
  const subs=Object.keys(SUBURB_DB).sort((a,b)=>b.length-a.length);
  for(const s of subs){
    if(al.includes(s))return{lat:SUBURB_DB[s][0],lng:SUBURB_DB[s][1],ok:true};
  }
  return{lat:WAREHOUSE_LAT,lng:WAREHOUSE_LNG,ok:false};
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function smartSpaceSplit(line){
  const tokens=line.split(/\s+/).filter(t=>t);
  const result=[];let addrBuf=[],foundPkg=false;
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i],tl=t.toLowerCase();
    if(i===0){result.push(t);continue;}
    if(/^(0\d{8,10}|\+61\s?\d{8,10}|04\d{8})$/.test(t)){
      if(addrBuf.length){result.push(addrBuf.join(' '));addrBuf=[];}
      result.push(t);continue;
    }
    if(!foundPkg&&/^\d{1,3}\s*(件|箱|个|pcs|packages?)?$/i.test(t)){
      if(addrBuf.length){result.push(addrBuf.join(' '));addrBuf=[];}
      result.push(t);foundPkg=true;continue;
    }
    if(tl==='现金'||tl==='cash'||tl==='cod'||tl==='转账'||tl==='刷卡'||tl==='card'||tl==='已付'||tl==='paid'){
      if(addrBuf.length){result.push(addrBuf.join(' '));addrBuf=[];}
      result.push(t);continue;
    }
    if(tl.match(/^(早上|上午|中午|下午|晚上|am|pm|before|after|随时|anytime)/i)||tl.match(/\d{1,2}(am|pm)/i)||tl.match(/\d{1,2}[点:：]\d{0,2}/)){
      if(addrBuf.length){result.push(addrBuf.join(' '));addrBuf=[];}
      result.push(t);continue;
    }
    addrBuf.push(t);
  }
  if(addrBuf.length)result.push(addrBuf.join(' '));
  return result;
}
function parseCustomerText(raw){
  const lines=raw.split(/[\n\r]+/).filter(l=>l.trim());
  const results=[];
  for(const line of lines){
    const trimmed=line.trim();
    if(!trimmed)continue;
    let parts;
    if(/[,，|\t]/.test(trimmed)){
      parts=trimmed.split(/[,，|\t]+/).map(p=>p.trim()).filter(p=>p);
    }else{
      parts=smartSpaceSplit(trimmed);
    }
    if(parts.length<2)continue;
    const entry={name:'',packages:0,address:'',phone:'',timeSlot:'',cash:false,note:''};
    entry.name=parts[0];
    const remaining=parts.slice(1);
    const addrParts=[];
    for(const part of remaining){
      const p=part.toLowerCase().trim();
      const pm=/^(0\d{8,10}|\+61\s?\d{8,10}|04\d{8})$/.test(part);
      if(pm){entry.phone=part;continue;}
      const km=/^(\d{1,3})\s*(件|箱|个|pcs|packages?)$/i.exec(part);
      if(km){entry.packages=parseInt(km[1]);continue;}
      const bn=/^(\d{1,2})$/.exec(part);
      if(bn&&!entry.packages){entry.packages=parseInt(bn[1]);continue;}
      if(p==='现金'||p==='cash'||p==='cod'){entry.cash=true;continue;}
      if(p==='转账'||p==='刷卡'||p==='card'||p==='已付'||p==='paid'){entry.cash=false;continue;}
      if(p.match(/^(早上|上午|中午|下午|晚上|am|pm|before|after|随时|anytime)/i)||p.match(/\d{1,2}(am|pm)/i)||p.match(/\d{1,2}[点:：]\d{0,2}/)){
        entry.timeSlot=part;continue;
      }
      if(part.length<=20&&!/\d/.test(part)&&!p.match(/st\b|rd\b|ave\b|road\b|street\b|court\b|close\b|drive\b|lane\b|way\b|place\b/i)){
        entry.note=part;continue;
      }
      addrParts.push(part);
    }
    entry.address=addrParts.join(' ');
    if(!entry.packages)entry.packages=1;
    results.push(entry);
  }
  return results;
}
function hav(a,b){
  const R=6371,dlat=(b.lat-a.lat)*Math.PI/180,dlng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dlat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dlng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function optimizeRoute(nodes){
  const wh={lat:WAREHOUSE_LAT,lng:WAREHOUSE_LNG};
  let unvisited=[...nodes],cur=wh,route=[];
  while(unvisited.length){
    let best=0,bestD=Infinity;
    for(let i=0;i<unvisited.length;i++){const d=hav(cur,unvisited[i]);if(d<bestD){bestD=d;best=i;}}
    route.push(unvisited[best]);cur=unvisited[best];unvisited.splice(best,1);
  }
  function rd(r){let d=hav(wh,r[0]);for(let i=0;i<r.length-1;i++)d+=hav(r[i],r[i+1]);return d+hav(r[r.length-1],wh);}
  let improved=true,passes=0;
  while(improved&&passes<300){improved=false;passes++;
    for(let i=0;i<route.length-1;i++){for(let k=i+1;k<route.length;k++){
      const c=[...route.slice(0,i),...route.slice(i,k+1).reverse(),...route.slice(k+1)];
      if(rd(c)<rd(route)-0.001){route=c;improved=true;}
    }}
  }
  return{route,distKm:rd(route)};
}
function assignMultiDriver(stops){
  if(drivers.length<=1||stops.length<=1){
    const nodes=stops.map((s,i)=>({...s,idx:i,lat:s._lat,lng:s._lng}));
    const{route,distKm}=optimizeRoute(nodes);
    const timeMin=Math.round(distKm*1.8);
    return[{driverName:drivers[0],driverIdx:0,
      stops:route.map(n=>({...stops[n.idx],_lat:n.lat,_lng:n.lng,driverIdx:0,driverName:drivers[0],photos:[],done:false,cashCollected:null})),
      distKm:distKm.toFixed(1),timeMin}];
  }
  const wh={lat:WAREHOUSE_LAT,lng:WAREHOUSE_LNG};
  const scored=stops.map((s,i)=>({...s,idx:i,dist:hav(wh,{lat:s._lat,lng:s._lng})}));
  scored.sort((a,b)=>a.dist-b.dist);
  const groups=drivers.map(()=>[]);
  scored.forEach((s,i)=>{groups[i%drivers.length].push(s);});
  const results=[];
  for(let d=0;d<drivers.length;d++){
    if(groups[d].length===0)continue;
    const nodes=groups[d].map(s=>({...s,lat:s._lat,lng:s._lng}));
    const{route,distKm}=optimizeRoute(nodes);
    const timeMin=Math.round(distKm*1.8);
    results.push({driverName:drivers[d],driverIdx:d,
      stops:route.map(n=>({...stops[n.idx],_lat:n.lat,_lng:n.lng,driverIdx:d,driverName:drivers[d],photos:[],done:false,cashCollected:null})),
      distKm:distKm.toFixed(1),timeMin});
  }
  return results;
}

async function doParseText(){
  if(!driverName){showToast('请先完成司机登录','err');return;}
  const raw=document.getElementById('rawInput').value.trim();
  let entries=[];
  if(raw){entries=parseCustomerText(raw);}
  entries=entries.concat(collectManualEntries());
  if(entries.length===0){showToast('请先粘贴信息或手动录入','err');return;}
  const btn=document.getElementById('parseTextBtn');
  btn.disabled=true;
  setStatus('loading','正在定位 '+entries.length+' 个地址...');
  let failed=0;
  const coords=entries.map(s=>{const c=geocodeLocal(s.address);if(!c.ok)failed++;return c;});
  setStatus('loading','正在优化路线（'+drivers.length+'辆车）...');
  await new Promise(r=>setTimeout(r,100));
  const stops=entries.map((s,i)=>({...s,_lat:coords[i].lat,_lng:coords[i].lng,_ok:coords[i].ok}));
  vrpRoutes=assignMultiDriver(stops);
  deliveries=vrpRoutes.reduce((acc,r)=>acc.concat(r.stops),[]);
  activeRouteTab=0;
  renderRouteResult();
  if(failed>0)showToast('⚠ '+failed+'个地址使用仓库默认坐标','err');
  else showToast('✅ '+entries.length+'个客户定位完成','ok');
  btn.disabled=false;
}
function addManualRow(data){
  manualEntries.push(data||{name:'',packages:'1',address:'',phone:'',timeSlot:'',cash:false,note:''});
  renderManualTable();
}
function collectManualEntries(){
  const results=[];
  document.querySelectorAll('.manual-entry-row').forEach(row=>{
    const inputs=row.querySelectorAll('input');
    const name=(inputs[0]?.value||'').trim();
    if(!name)return;
    const addr=(inputs[2]?.value||'').trim();
    if(!addr)return;
    results.push({
      name,packages:parseInt(inputs[1]?.value)||1,address:addr,
      phone:(inputs[3]?.value||'').trim(),timeSlot:(inputs[4]?.value||'').trim(),
      cash:inputs[5]?.checked||false,note:(inputs[6]?.value||'').trim()
    });
  });
  return results;
}
function renderManualTable(){
  const c=document.getElementById('manualTable');
  c.innerHTML=manualEntries.map((e,i)=>
    '<div class="manual-entry-row" id="mrow-'+i+'">'+
    '<input type="text" placeholder="姓名" value="'+esc(e.name||'')+'" onchange="updateManual('+i+',\'name\',this.value)" style="max-width:80px">'+
    '<input type="number" placeholder="件数" value="'+(e.packages||'1')+'" onchange="updateManual('+i+',\'packages\',this.value)" style="max-width:50px" min="1">'+
    '<input type="text" placeholder="地址" value="'+esc(e.address||'')+'" onchange="updateManual('+i+',\'address\',this.value)" style="min-width:120px">'+
    '<input type="text" placeholder="电话" value="'+esc(e.phone||'')+'" onchange="updateManual('+i+',\'phone\',this.value)" style="max-width:100px">'+
    '<input type="text" placeholder="时间" value="'+esc(e.timeSlot||'')+'" onchange="updateManual('+i+',\'timeSlot\',this.value)" style="max-width:80px">'+
    '<label style="font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:3px;margin:0;cursor:pointer"><input type="checkbox" '+(e.cash?'checked':'')+' onchange="updateManual('+i+',\'cash\',this.checked)">现金</label>'+
    '<button class="btn btn-danger btn-sm" onclick="removeManualRow('+i+')" style="padding:4px 8px">&#x2715;</button></div>'
  ).join('');
}
function updateManual(idx,field,value){if(idx>=0&&idx<manualEntries.length){manualEntries[idx][field]=value;}}
function removeManualRow(idx){manualEntries.splice(idx,1);renderManualTable();}
function renderRouteResult(){
  document.getElementById('routeCard').style.display='block';
  const allStops=vrpRoutes.reduce((acc,r)=>acc.concat(r.stops),[]);
  const pkgs=allStops.reduce((s,d)=>s+d.packages,0);
  const cash=allStops.filter(d=>d.cash).length;
  const km=vrpRoutes.reduce((s,r)=>s+parseFloat(r.distKm),0);
  const min=vrpRoutes.reduce((s,r)=>s+r.timeMin,0);
  document.getElementById('statTotal').textContent=allStops.length;
  document.getElementById('statPkgs').textContent=pkgs;
  document.getElementById('statCash').textContent=cash;
  document.getElementById('statKm').textContent=km.toFixed(1);
  document.getElementById('statMin').textContent=min;
  const tabs=document.getElementById('driverRouteTabs');
  tabs.innerHTML=vrpRoutes.map((r,i)=>
    '<button class="drt'+(i===activeRouteTab?' active':'')+'" onclick="switchRouteTab('+i+')">&#x1F69A; '+esc(r.driverName)+' &middot; '+r.stops.length+'单 &middot; '+r.distKm+'km</button>'
  ).join('');
  renderRouteTable(activeRouteTab);
  setStatus('success','✅ '+allStops.length+'单优化完成 &middot; '+km.toFixed(1)+'km &middot; 约'+min+'分钟');
}
function switchRouteTab(idx){activeRouteTab=idx;
  document.querySelectorAll('.drt').forEach((b,i)=>b.classList.toggle('active',i===idx));
  renderRouteTable(idx);
}
function renderRouteTable(dIdx){
  const route=vrpRoutes[dIdx];
  if(!route){document.getElementById('tableWrap').innerHTML='';return;}
  const color=DRIVER_COLORS[dIdx%6];
  let html='<table><thead><tr><th>#</th><th>客户</th><th>件</th><th>地址</th><th>时间</th><th>现金</th><th>导航</th></tr></thead><tbody>';
  route.stops.forEach((d,i)=>{
    html+='<tr><td><span class="seq-num" style="background:'+color+';color:'+(dIdx<3?'#fff':'#0f1117')+'">'+(i+1)+'</span></td>'+
    '<td><b>'+esc(d.name)+'</b>'+(d.note?'<br><span style="font-size:11px;color:var(--mut)">'+esc(d.note)+'</span>':'')+'</td>'+
    '<td style="text-align:center">'+d.packages+'</td>'+
    '<td style="font-size:12px;max-width:150px">'+esc(d.address)+'</td>'+
    '<td style="font-size:11px;white-space:nowrap">'+esc(d.timeSlot||'-')+'</td>'+
    '<td>'+(d.cash?'<span class="cash-badge">💰现金</span>':'<span style="color:var(--mut);font-size:12px">-</span>')+'</td>'+
    '<td><button class="nav-btn" data-addr="'+esc(d.address||'')+'" onclick="navSingle(this.dataset.addr)">导航</button></td></tr>';
  });
  html+='</tbody></table>';
  document.getElementById('tableWrap').innerHTML=html;
}
function navSingle(addr){window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr+', Melbourne VIC, Australia'),'_blank');}
function openAllMaps(){
  const route=vrpRoutes[activeRouteTab];
  if(!route||!route.stops.length)return;
  const wh=encodeURIComponent(WAREHOUSE_ADDR);
  const wps=route.stops.slice(0,-1).map(d=>encodeURIComponent(d.address+', Melbourne VIC, Australia')).join('|');
  const dest=encodeURIComponent(route.stops[route.stops.length-1].address+', Melbourne VIC, Australia');
  let url='https://www.google.com/maps/dir/?api=1&origin='+wh+'&destination='+dest;
  if(wps)url+='&waypoints='+wps;
  window.open(url,'_blank');
}
async function startDelivery(){
  if(!vrpRoutes.length){showToast('请先排线','err');return;}
  const date=document.getElementById('deliveryDate').value;
  currentSession={date,driver:driverName,drivers:[...drivers],createdAt:Date.now(),
    routes:vrpRoutes.map(r=>({...r,stops:r.stops.map(s=>({...s}))})),
    stops:deliveries.map(s=>({...s}))};
  const id=await dbSave(currentSession);
  currentSession.id=id;
  switchPage('driver');
  showToast('开始送货！','ok');
}

function cashTotal(){
  if(!currentSession)return 0;
  return currentSession.stops.reduce((s,x)=>s+(x.cash?(parseFloat(x.cashCollected)||0):0),0);
}
function updateCashSummary(){
  const el=document.getElementById('cashSummaryAmount');
  const detail=document.getElementById('cashSummaryDetail');
  if(!el||!currentSession)return;
  const total=cashTotal();
  const collected=currentSession.stops.filter(x=>x.cash&&(parseFloat(x.cashCollected)||0)>0).length;
  const totalCashStops=currentSession.stops.filter(x=>x.cash).length;
  el.textContent='$'+total.toFixed(2);
  if(detail)detail.textContent=totalCashStops?'已收 '+collected+'/'+totalCashStops+' 单':'';
}
function renderDriverStops(){
  if(!currentSession){
    document.getElementById('driverStops').innerHTML='<div class="empty-state"><div class="icon">&#x1F69A;</div>请先在排班页排线<br>然后点击「开始送货」</div>';
    return;
  }
  document.getElementById('driverBarName').textContent='司机：'+currentSession.driver;
  document.getElementById('driverBarDate').textContent=currentSession.date;
  const container=document.getElementById('driverStops');
  container.innerHTML='';
  const hasCash=currentSession.stops.some(x=>x.cash);
  if(hasCash){
    const banner=document.createElement('div');banner.style.cssText='padding:12px 14px 0';
    banner.innerHTML='<div class="cash-summary"><div class="cash-summary-icon">💰</div><div><div class="cash-summary-label">当天现金汇总</div><div class="cash-summary-amount" id="cashSummaryAmount">$0.00</div><div class="cash-summary-detail" id="cashSummaryDetail">-</div></div></div>';
    container.appendChild(banner);
  }
  currentSession.stops.forEach((d,i)=>{
    const color=DRIVER_COLORS[(d.driverIdx||0)%6];
    const card=document.createElement('div');
    card.className='stop-card'+(d.done?' done':'');
    card.id='dstop-'+i;
    const photosHtml=(d.photos||[]).map((p,pi)=>'<img class="photo-thumb" src="'+p+'" alt="照片'+(pi+1)+'" onclick="openLightbox(\''+p.replace(/'/g,"\\'")+'\')">').join('');
    const cashBadge=d.cash?'<span class="cash-badge" style="margin-left:auto">💰 现金'+(d.cashCollected?' &middot; $'+parseFloat(d.cashCollected).toFixed(2):'')+'</span>':'<span style="margin-left:auto;font-size:12px;color:var(--mut)">-</span>';
    const cashHtml=d.cash?('<div class="cash-input-area"><label>💰 收到的现金</label><div class="cash-input-row"><span>$</span><input class="cash-amount-input" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="'+(d.cashCollected||'')+'" onchange="saveCash('+i+',this.value)" oninput="saveCash('+i+',this.value)" id="cash-input-'+i+'"><span class="cash-saved-badge" id="cash-saved-'+i+'">'+(d.cashCollected?'✓ 已记录':'')+'</span></div></div>'):'';
    card.innerHTML='<div class="stop-header"><span class="seq-num" style="background:'+(d.done?'#444':color)+';color:'+((d.driverIdx||0)<3?'#fff':'#0f1117')+'">'+(i+1)+'</span><b style="font-size:15px">'+esc(d.name)+'</b>'+(d.driverName?'<span style="font-size:11px;color:var(--mut);margin-left:4px">&middot; '+esc(d.driverName)+'</span>':'')+cashBadge+'</div>'+
    '<div class="stop-body"><div class="stop-info"><div>📦 <b>'+d.packages+'</b> 件</div><div>📍 <b>'+esc(d.address)+'</b></div><div>📞 <b><a href="tel:'+esc(d.phone||'')+'" style="color:var(--accent)">'+esc(d.phone||'-')+'</a></b></div><div>⏰ <b>'+esc(d.timeSlot||'-')+'</b></div>'+(d.note?'<div>📝 '+esc(d.note)+'</div>':'')+'</div>'+
    '<div class="stop-actions"><button class="btn btn-primary btn-sm" id="nav-btn-'+i+'">🗺 导航</button><button class="btn btn-green btn-sm" id="done-btn-'+i+'">'+(d.done?'↩ 撤销':'✓ 已送达')+'</button></div>'+
    '<div class="photo-area"><label>📸 送货照片</label><div class="photo-row" id="photos-'+i+'">'+photosHtml+'<label class="photo-upload-btn">＋<input type="file" accept="image/*" capture="environment" id="photo-input-'+i+'"></label></div></div>'+cashHtml+'</div>';
    container.appendChild(card);
    const addr=(d.address||'')+', Melbourne VIC, Australia';
    document.getElementById('nav-btn-'+i).addEventListener('click',()=>{window.location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr);});
    document.getElementById('done-btn-'+i).addEventListener('click',()=>markDone(i));
    document.getElementById('photo-input-'+i).addEventListener('change',function(){addPhoto(i,this);});
    if(i===currentSession.stops.length-1){
      const ret=document.createElement('div');ret.style.cssText='padding:8px 14px 20px';
      const btn=document.createElement('button');btn.className='btn btn-green btn-full';
      btn.textContent='🏠 全部送完 &middot; 导航回仓库';
      btn.onclick=()=>{window.location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(WAREHOUSE_ADDR);};
      ret.appendChild(btn);container.appendChild(ret);
    }
  });
  updateCashSummary();
}
function markDone(idx){
  if(!currentSession)return;
  currentSession.stops[idx].done=!currentSession.stops[idx].done;
  dbPut(currentSession);
  const card=document.getElementById('dstop-'+idx);
  if(card)card.className='stop-card'+(currentSession.stops[idx].done?' done':'');
  const btn=document.getElementById('done-btn-'+idx);
  if(btn)btn.textContent=currentSession.stops[idx].done?'↩ 撤销':'✓ 已送达';
  updateCashSummary();
}
function saveCash(stopIdx,value){
  if(!currentSession)return;
  const amount=parseFloat(value)||0;
  currentSession.stops[stopIdx].cashCollected=amount>0?amount:null;
  dbPut(currentSession);
  const badge=document.getElementById('cash-saved-'+stopIdx);
  if(badge)badge.textContent=amount>0?'✓ 已记录':'';
  updateCashSummary();
}
function addPhoto(stopIdx,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const dataUrl=e.target.result;
    if(!currentSession.stops[stopIdx].photos)currentSession.stops[stopIdx].photos=[];
    currentSession.stops[stopIdx].photos.push(dataUrl);
    await dbPut(currentSession);
    const row=document.getElementById('photos-'+stopIdx);
    if(row){
      const img=document.createElement('img');img.className='photo-thumb';img.src=dataUrl;
      img.addEventListener('click',()=>openLightbox(dataUrl));
      row.insertBefore(img,row.lastElementChild);
    }
    showToast('照片已保存','ok');input.value='';
  };
  reader.readAsDataURL(file);
}

async function loadHistory(){
  const list=document.getElementById('historyList');
  list.innerHTML='<div style="padding:20px;text-align:center;color:var(--mut)">加载中...</div>';
  try{
    const sessions=await dbAll();
    if(!sessions.length){list.innerHTML='<div class="empty-state"><div class="icon">🕐</div>暂无历史记录</div>';return;}
    list.innerHTML='';
    sessions.forEach(s=>{
      const stops=s.stops||[];
      const done=stops.filter(x=>x.done).length,total=stops.length;
      const pkgs=stops.reduce((a,x)=>a+x.packages,0);
      const cashStops=stops.filter(x=>x.cash).length;
      const cashAmt=stops.reduce((a,x)=>a+(x.cash?(parseFloat(x.cashCollected)||0):0),0);
      const photos=stops.reduce((a,x)=>a+(x.photos?x.photos.length:0),0);
      const div=document.createElement('div');div.className='history-item';
      div.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="history-date">📅 '+esc(s.date)+'</div><span style="font-size:12px;color:'+(done===total?'var(--green)':'var(--yellow)')+'">'+done+'/'+total+' 已送达</span></div>'+
      '<div class="history-meta">👤 '+esc(s.driver)+' &nbsp;|&nbsp; 📦 '+total+'单/'+pkgs+'件'+
      (cashStops?' &nbsp;|&nbsp; 💰 现金'+cashStops+'单'+(cashAmt>0?' &middot; <b style="color:var(--yellow)">$'+cashAmt.toFixed(2)+'</b>':''):'')+
      (photos?' &nbsp;|&nbsp; 📷 '+photos+'张':'')+'</div>'+
      '<div class="history-tags">'+stops.slice(0,5).map(x=>'<span class="tag">'+esc(x.name)+'</span>').join('')+(stops.length>5?'<span class="tag">+'+String(stops.length-5)+'</span>':'')+'</div>';
      div.onclick=()=>openDetail(s);
      list.appendChild(div);
    });
  }catch(e){list.innerHTML='<div class="empty-state"><div class="icon">⚠️</div>加载失败</div>';}
}
function openDetail(session){
  document.getElementById('detailTitle').textContent=session.date+' &middot; '+session.driver;
  const content=document.getElementById('detailContent');content.innerHTML='';
  const stops=session.stops||[];
  const cashStops=stops.filter(x=>x.cash);
  if(cashStops.length>0){
    const totalCash=cashStops.reduce((a,x)=>a+(parseFloat(x.cashCollected)||0),0);
    const recorded=cashStops.filter(x=>parseFloat(x.cashCollected)>0).length;
    const banner=document.createElement('div');banner.style.cssText='margin:10px 14px 0';
    banner.innerHTML='<div class="cash-summary"><div class="cash-summary-icon">💰</div><div><div class="cash-summary-label">当天现金收取总额</div><div class="cash-summary-amount">$'+totalCash.toFixed(2)+'</div><div class="cash-summary-detail">已记录 '+recorded+'/'+cashStops.length+' 单</div></div></div>';
    content.appendChild(banner);
  }
  stops.forEach((d,i)=>{
    const div=document.createElement('div');div.className='detail-stop';
    const photos=(d.photos||[]).map(p=>'<img class="detail-photo" src="'+p+'" onclick="openLightbox(\''+p.replace(/'/g,"\\'")+'\')" alt="">').join('');
    div.innerHTML='<div style="display:flex;align-items:center;gap:10px"><span class="seq-num" style="background:'+(d.done?'var(--green)':'var(--accent)')+';color:#fff">'+(i+1)+'</span><b style="font-size:15px">'+esc(d.name)+'</b>'+(d.done?'<span style="margin-left:auto;font-size:12px;color:var(--green)">✓ 送达</span>':'<span style="margin-left:auto;font-size:12px;color:var(--red)">未送达</span>')+'</div>'+
    '<div class="detail-stop-meta"><div>📦 '+d.packages+'件 &nbsp; '+(d.cash?'<span class="cash-badge">💰 现金'+(d.cashCollected?' &middot; $'+parseFloat(d.cashCollected).toFixed(2):' &middot; 未记录')+'</span>':'<span style="color:var(--mut);font-size:12px">无</span>')+'</div><div>📍 '+esc(d.address)+'</div><div>📞 '+esc(d.phone||'-')+'</div><div>⏰ '+esc(d.timeSlot||'-')+'</div>'+(d.note?'<div>📝 '+esc(d.note)+'</div>':'')+'</div>'+
    (photos?'<div class="detail-photos">'+photos+'</div>':'<div style="font-size:12px;color:var(--mut);margin-top:8px">📷 无照片</div>');
    content.appendChild(div);
  });
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('open');}
function copyDriverSheet(){
  const date=document.getElementById('deliveryDate').value;
  let txt='🚚 环球伙拼送货单 '+date+'\\n'+'─'.repeat(36)+'\\n\\n';
  vrpRoutes.forEach(route=>{
    txt+='【司机：'+route.driverName+'】'+route.stops.length+'单 &middot; '+route.distKm+'km\\n';
    route.stops.forEach((d,i)=>{
      txt+='  '+(i+1)+'. '+d.name+' 📦'+d.packages+'件'+(d.cash?' 💰现金':'')+'\\n';
      txt+='     📍 '+d.address+'\\n     📞 '+(d.phone||'-')+' ⏰ '+(d.timeSlot||'-')+'\\n';
      if(d.note)txt+='     📝 '+d.note+'\\n';
    });
    txt+='\\n';
  });
  const pkgs=deliveries.reduce((s,d)=>s+d.packages,0);
  const cash=deliveries.filter(d=>d.cash).length;
  txt+='─'.repeat(36)+'\\n合计：'+deliveries.length+'单/'+pkgs+'件/现金'+cash+'单';
  navigator.clipboard.writeText(txt).then(()=>showToast('已复制','ok')).catch(()=>showToast('复制失败','err'));
}
function clearPlan(){
  deliveries=[];vrpRoutes=[];activeRouteTab=0;manualEntries=[];
  document.getElementById('rawInput').value='';
  document.getElementById('routeCard').style.display='none';
  document.getElementById('tableWrap').innerHTML='';
  document.getElementById('manualTable').innerHTML='';
  currentSession=null;
  setStatus('idle','请录入客户信息...');
}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}
function setStatus(type,msg){
  const bar=document.getElementById('statusBar');
  if(type==='loading')bar.innerHTML='<div class="spinner"></div>'+msg;
  else if(type==='success')bar.innerHTML='<span style="color:var(--green)">●</span> '+msg;
  else if(type==='error')bar.innerHTML='<span style="color:var(--red)">●</span> '+msg;
  else bar.innerHTML=msg;
}
let toastT;
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=(type==='ok'?'✓ ':'⚠ ')+msg;
  t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),3000);
}
(async()=>{
  await openDB();
  document.getElementById('deliveryDate').value=new Date().toISOString().split('T')[0];
  const saved=localStorage.getItem('driverName');
  if(saved){document.getElementById('driverNameInput').value=saved;confirmDriver();}
  const mf={name:'环球伙拼送货',short_name:'送货排班',display:'standalone',background_color:'#0f1117',theme_color:'#0f1117',start_url:'./',
    icons:[{src:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>',sizes:'any',type:'image/svg+xml'}]};
  const blob=new Blob([JSON.stringify(mf)],{type:'application/json'});
  document.getElementById('manifestLink').href=URL.createObjectURL(blob);
})();
