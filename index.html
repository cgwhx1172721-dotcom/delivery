<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="version" content="20260511_v10_local">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="环球伙拼送货">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="mf" href="manifest.json">
<title>环球伙拼 · 送货排班</title>
<style>
:root{--bg:#0f1117;--s:#1a1d27;--s2:#22263a;--bd:#2e3250;--ac:#4f8ef7;--gn:#38c9a0;--rd:#f76b6b;--yw:#f7c94f;--tx:#e8eaf6;--mu:#7b82a8;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'PingFang SC',sans-serif;font-size:14px;display:flex;flex-direction:column;}

/* Shell */
.hdr{background:var(--s);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(10px,env(safe-area-inset-top));}
.bnav{background:var(--s);border-top:1px solid var(--bd);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;border:none;background:none;color:var(--mu);font-size:11px;cursor:pointer;font-family:inherit;}
.ni .ic{font-size:19px;line-height:1;}
.ni.on{color:var(--ac);}
.pg{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pg.on{display:flex;flex-direction:column;}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.mo.hid{display:none;}
.mbox{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:26px 22px;width:100%;max-width:360px;text-align:center;}
.mbox h2{font-size:19px;margin-bottom:8px;}
.mbox p{color:var(--mu);font-size:13px;margin-bottom:18px;line-height:1.6;}
.mbox input{width:100%;background:var(--s2);border:2px solid var(--bd);border-radius:9px;color:var(--tx);font-size:18px;padding:12px;outline:none;text-align:center;font-family:inherit;margin-bottom:12px;}
.mbox input:focus{border-color:var(--ac);}

/* Cards */
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin:8px 12px 0;}
.ch{padding:9px 13px;display:flex;align-items:center;gap:9px;background:var(--s2);border-bottom:1px solid var(--bd);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 16px;border-radius:9px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.btn:active{opacity:.7;}
.bp{background:var(--ac);color:#fff;}
.bg{background:var(--gn);color:#0f1117;}
.bs{background:var(--s2);border:1px solid var(--bd);color:var(--tx);}
.br{background:rgba(247,107,107,.12);color:var(--rd);border:1px solid rgba(247,107,107,.3);}
.bf{width:100%;margin-top:9px;}
.bsm{padding:6px 11px;font-size:12px;}

/* Form */
textarea,input[type=text],input[type=date],input[type=number],input[type=tel]{background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-size:13px;padding:8px 10px;outline:none;font-family:inherit;}
textarea{width:100%;resize:vertical;}
input:focus,textarea:focus{border-color:var(--ac);}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;}

/* Date/driver bar */
.dbar{padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;background:var(--s);flex-shrink:0;}
.dchip{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--ac);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;}

/* Table */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--s2);padding:8px 9px;text-align:left;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;white-space:nowrap;}
td{padding:8px 9px;border-bottom:1px solid var(--bd);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,.02);}
.sn{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.cb{background:rgba(247,201,79,.15);color:var(--yw);border:1px solid rgba(247,201,79,.3);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:600;}
.abar{padding:10px 13px;display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--bd);}

/* Status */
.sb{padding:9px 13px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd);display:flex;align-items:center;gap:5px;min-height:36px;flex-shrink:0;}

/* Manual entry table */
.etbl{width:100%;border-collapse:collapse;}
.etbl td{padding:5px 6px;border-bottom:1px solid var(--bd);vertical-align:middle;}
.etbl input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:5px;color:var(--tx);font-size:12px;padding:5px 7px;outline:none;font-family:inherit;}
.etbl input:focus{border-color:var(--ac);}
.etbl select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:5px;color:var(--tx);font-size:12px;padding:5px 7px;outline:none;font-family:inherit;}
.del-btn{background:none;border:none;color:var(--rd);font-size:16px;cursor:pointer;padding:2px 6px;}

/* Driver mode */
.drbar{background:linear-gradient(135deg,var(--ac),#7c5cf7);padding:12px 14px;display:flex;align-items:center;gap:9px;flex-shrink:0;}
.sc{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);margin:9px 13px 0;overflow:hidden;}
.sc.done{opacity:.42;}
.sh{padding:10px 13px;display:flex;align-items:center;gap:9px;background:var(--s2);border-bottom:1px solid var(--bd);}
.sb2{padding:11px 13px;}
.si{font-size:13px;color:var(--mu);line-height:2.1;}
.si b{color:var(--tx);}
.sa{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}

/* Photo */
.pa{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px;}
.pr{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;}
.pt{width:60px;height:60px;border-radius:7px;object-fit:cover;border:1px solid var(--bd);cursor:pointer;}
.pu{width:60px;height:60px;border:2px dashed var(--bd);border-radius:7px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative;color:var(--mu);}
.pu input{position:absolute;inset:0;opacity:0;cursor:pointer;}

/* Cash */
.ca{margin-top:9px;padding:10px 12px;background:rgba(247,201,79,.07);border:1px solid rgba(247,201,79,.25);border-radius:7px;}
.ca label{color:var(--yw);font-weight:600;}
.car{display:flex;align-items:center;gap:7px;margin-top:5px;}
.cai{background:var(--s2);border:1px solid rgba(247,201,79,.4);border-radius:7px;color:var(--yw);font-size:17px;font-weight:700;padding:7px 10px;outline:none;width:120px;text-align:right;font-family:inherit;}
.cs{background:linear-gradient(135deg,rgba(247,201,79,.15),rgba(247,201,79,.05));border:1px solid rgba(247,201,79,.3);border-radius:var(--r);margin:0 13px 10px;padding:12px 14px;display:flex;align-items:center;gap:10px;}

/* History */
.hi{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);margin:0 13px 9px;padding:13px;cursor:pointer;}
.hi:hover{border-color:var(--ac);}
.tag{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--mu);}
.do{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none;}
.do.op{display:block;}
.doh{background:var(--s);border-bottom:1px solid var(--bd);padding:12px 14px;display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:10;padding-top:max(12px,env(safe-area-inset-top));}
.ds{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);margin:9px 13px;padding:13px;}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;display:none;align-items:center;justify-content:center;}
.lb.op{display:flex;}
.lb img{max-width:95vw;max-height:90vh;border-radius:7px;}
.lbc{position:absolute;top:18px;right:18px;font-size:30px;color:#fff;cursor:pointer;}

/* Toast */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:9px 18px;border-radius:7px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:400;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Stat pills */
.sp{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--mu);}
.sp b{color:var(--tx);}

/* Input tabs */
.tabs{display:flex;background:var(--s2);border-bottom:1px solid var(--bd);}
.tb{flex:1;padding:10px 6px;background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;}
.tb.on{color:var(--ac);border-bottom-color:var(--ac);}
.tp{display:none;padding:13px;}
.tp.on{display:block;}

/* Colors */
.c0{background:#4f8ef7;}.c1{background:#38c9a0;}.c2{background:#f7c94f;color:#0f1117!important;}
.c3{background:#f76b6b;}.c4{background:#a78bfa;}.c5{background:#fb923c;}
</style>
</head>
<body>

<!-- DRIVER GATE -->
<div class="mo" id="gate">
  <div class="mbox">
    <div style="font-size:40px;margin-bottom:10px">🚚</div>
    <h2>司机登录</h2>
    <p>输入姓名才能开始。每次送货记录与您的名字绑定。</p>
    <input type="text" id="dname" placeholder="输入司机姓名" maxlength="20"
      oninput="document.getElementById('dok').disabled=this.value.trim().length<2"
      onkeydown="if(event.key==='Enter')login()">
    <button class="btn bp bf" id="dok" onclick="login()" disabled>确认进入 →</button>
  </div>
</div>

<!-- HEADER -->
<div class="hdr">
  <span style="font-size:19px">🚚</span>
  <div><div style="font-size:14px;font-weight:700">环球伙拼送货</div><div style="font-size:11px;color:var(--mu)">v10 · 本地运行</div></div>
  <div style="margin-left:auto">
    <div class="dchip" onclick="logout()" id="dchip" style="display:none">👤 <span id="dchipn"></span></div>
  </div>
</div>

<!-- DATE BAR -->
<div class="dbar" id="dbar" style="display:none">
  <span style="font-size:12px;color:var(--mu)">📅</span>
  <input type="date" id="ddate" style="max-width:160px;flex:none">
</div>

<!-- PAGE: 排班 -->
<div class="pg on" id="pg-plan">

  <!-- Input card -->
  <div class="card" style="margin-bottom:0">
    <div class="ch"><span class="sn c0">1</span><span style="font-weight:700">录入客户信息</span></div>
    <div class="tabs">
      <button class="tb on" onclick="stab('text')" id="t-text">📋 粘贴文字</button>
      <button class="tb" onclick="stab('manual')" id="t-manual">✏️ 手动填写</button>
    </div>

    <!-- Tab: text -->
    <div class="tp on" id="tp-text">
      <label>粘贴任意格式的客户清单（每行一个客户）</label>
      <textarea id="rawtxt" rows="6" placeholder="格式示例（支持各种写法）：
张三，3件，3 Oak St Doncaster，0412345678，下午2点，转账
李四 2件 25 Smith Rd Box Hill 0423456789 现金
王五|5件|10 Main St Glen Waverley|0434567890|随时|转账"></textarea>
      <button class="btn bp bf" onclick="parseText()">✨ 解析并生成最短路线</button>
    </div>

    <!-- Tab: manual -->
    <div class="tp" id="tp-manual">
      <div style="overflow-x:auto">
        <table class="etbl" id="etbl">
          <thead>
            <tr style="background:var(--s2)">
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)">客户名</th>
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)">件数</th>
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)">地址</th>
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)">电话</th>
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)">时间</th>
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)">付款</th>
              <th style="padding:6px 7px;font-size:11px;color:var(--mu)"></th>
            </tr>
          </thead>
          <tbody id="etbody"></tbody>
        </table>
      </div>
      <button class="btn bs bf" style="margin-top:7px" onclick="addRow()">＋ 添加一行</button>
      <button class="btn bp bf" onclick="parseManual()">✨ 生成最短路线</button>
    </div>

    <div class="sb" id="sb">请先完成司机登录...</div>
  </div>

  <!-- Route result -->
  <div id="rcard" style="margin:8px 12px 12px;display:none">
    <div class="card" style="margin:0">
      <div class="ch">
        <span class="sn c1" style="color:#0f1117">2</span>
        <span style="font-weight:700">最短路线</span>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid var(--bd)">
        <div class="sp">共 <b id="stn">0</b> 单</div>
        <div class="sp"><b id="stk">0</b> 件</div>
        <div class="sp">💰 现金 <b id="stc">0</b> 单</div>
        <div class="sp">~<b id="stkm">0</b> km</div>
      </div>
      <div class="tw" id="rtbl"></div>
      <div class="abar">
        <button class="btn bg bsm" onclick="openMaps()">🗺 Google Maps导航</button>
        <button class="btn bp bsm" onclick="startDel()">🚚 开始送货</button>
        <button class="btn bs bsm" onclick="copySheet()">📋 复制</button>
        <button class="btn br bsm" onclick="clearAll()">✕ 清空</button>
      </div>
    </div>
  </div>
</div>

<!-- PAGE: 送货 -->
<div class="pg" id="pg-driver">
  <div class="drbar" id="drbar">
    <span>🚚</span><span id="drname" style="font-weight:700;font-size:14px">司机模式</span>
    <span style="margin-left:auto;font-size:12px;opacity:.8" id="drdate"></span>
  </div>
  <div id="drstops" style="padding-bottom:20px"></div>
</div>

<!-- PAGE: 历史 -->
<div class="pg" id="pg-hist">
  <div style="padding:12px 14px 6px;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.7px">📦 历史记录</div>
  <div id="hlist" style="padding-bottom:20px"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bnav">
  <button class="ni on" onclick="nav('plan')" id="n-plan"><span class="ic">📋</span>排班</button>
  <button class="ni" onclick="nav('driver')" id="n-driver"><span class="ic">🚚</span>送货</button>
  <button class="ni" onclick="nav('hist')" id="n-hist"><span class="ic">🕐</span>历史</button>
</div>

<!-- DETAIL OVERLAY -->
<div class="do" id="dov">
  <div class="doh">
    <button class="btn bs bsm" onclick="cdov()">← 返回</button>
    <span style="font-weight:700;font-size:14px" id="dovt"></span>
  </div>
  <div id="dovc" style="padding-bottom:30px"></div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="clb()">
  <span class="lbc">✕</span>
  <img id="lbimg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════
// STATE
// ══════════════════════════════
let driverName='', deliveries=[], session=null;
const WH='U1/41-43 Lexton Road, Box Hill North VIC 3129';
const WH_LL=[-37.7533,145.1210]; // [lat,lng]
const COLORS=['#4f8ef7','#38c9a0','#f7c94f','#f76b6b','#a78bfa','#fb923c'];

// ══════════════════════════════
// DB
// ══════════════════════════════
let db;
function openDB(){return new Promise((res,rej)=>{
  const q=indexedDB.open('hq_v4',1);
  q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('s'))e.target.result.createObjectStore('s',{keyPath:'id',autoIncrement:true});};
  q.onsuccess=e=>{db=e.target.result;res();};
  q.onerror=()=>rej();
});}
const dbs=s=>new Promise((r,j)=>{const q=db.transaction('s','readwrite').objectStore('s').add(s);q.onsuccess=()=>r(q.result);q.onerror=()=>j();});
const dbp=s=>new Promise((r,j)=>{const q=db.transaction('s','readwrite').objectStore('s').put(s);q.onsuccess=()=>r();q.onerror=()=>j();});
const dba=()=>new Promise((r,j)=>{const q=db.transaction('s','readonly').objectStore('s').getAll();q.onsuccess=()=>r([...q.result].reverse());q.onerror=()=>j();});

// ══════════════════════════════
// LOGIN
// ══════════════════════════════
function login(){
  const v=document.getElementById('dname').value.trim();
  if(v.length<2)return;
  driverName=v; localStorage.setItem('dn',v);
  document.getElementById('gate').classList.add('hid');
  document.getElementById('dchip').style.display='flex';
  document.getElementById('dchipn').textContent=v;
  document.getElementById('dbar').style.display='flex';
  ss('请录入客户信息，选择录入方式开始...');
  toast('欢迎，'+v+'！');
  addRow(); addRow(); // start with 2 blank rows
}
function logout(){if(!confirm('切换司机？'))return;driverName='';localStorage.removeItem('dn');document.getElementById('gate').classList.remove('hid');document.getElementById('dname').value='';document.getElementById('dok').disabled=true;document.getElementById('dchip').style.display='none';document.getElementById('dbar').style.display='none';}

// ══════════════════════════════
// NAV
// ══════════════════════════════
function nav(p){
  ['plan','driver','hist'].forEach(x=>{
    document.getElementById('pg-'+x).classList.toggle('on',x===p);
    document.getElementById('n-'+x).classList.toggle('on',x===p);
  });
  if(p==='driver')renderDriver();
  if(p==='hist')loadHist();
}
function stab(t){
  ['text','manual'].forEach(x=>{
    document.getElementById('t-'+x).classList.toggle('on',x===t);
    document.getElementById('tp-'+x).classList.toggle('on',x===t);
  });
}

// ══════════════════════════════
// MANUAL ENTRY
// ══════════════════════════════
let rowId=0;
function addRow(){
  const id=++rowId;
  const tr=document.createElement('tr');
  tr.id='row-'+id;
  tr.innerHTML=`
    <td><input type="text" placeholder="客户名" style="min-width:70px"></td>
    <td><input type="number" placeholder="1" min="1" style="width:50px" value="1"></td>
    <td><input type="text" placeholder="地址含suburb" style="min-width:130px"></td>
    <td><input type="tel" placeholder="04xx" style="min-width:90px"></td>
    <td><input type="text" placeholder="时间" style="min-width:70px"></td>
    <td><select><option value="0">无</option><option value="1">💰现金</option></select></td>
    <td><button class="del-btn" onclick="delRow(${id})">×</button></td>`;
  document.getElementById('etbody').appendChild(tr);
}
function delRow(id){
  const el=document.getElementById('row-'+id);
  if(el)el.remove();
}
function parseManual(){
  if(!driverName){toast('请先司机登录','e');return;}
  const rows=[...document.getElementById('etbody').querySelectorAll('tr')];
  const arr=[];
  rows.forEach(tr=>{
    const inputs=tr.querySelectorAll('input');
    const sel=tr.querySelector('select');
    const name=inputs[0].value.trim();
    const pkg=parseInt(inputs[1].value)||1;
    const addr=inputs[2].value.trim();
    if(!name||!addr)return;
    arr.push({name,packages:pkg,address:addr,phone:inputs[3].value.trim(),timeSlot:inputs[4].value.trim(),cash:sel&&sel.value==='1',note:''});
  });
  if(!arr.length){toast('请至少填写一行客户信息','e');return;}
  runRoute(arr);
}

// ══════════════════════════════
// TEXT PARSING (local, no API)
// ══════════════════════════════
function parseText(){
  if(!driverName){toast('请先司机登录','e');return;}
  const raw=document.getElementById('rawtxt').value.trim();
  if(!raw){toast('请先粘贴客户信息','e');return;}

  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l.length>2);
  const arr=[];

  lines.forEach(line=>{
    // Split by common delimiters: comma, pipe, tab, multiple spaces
    const parts=line.split(/[,，|｜\t]|(?<=\S)\s{2,}/).map(p=>p.trim()).filter(Boolean);
    if(parts.length<2)return;

    // Try to identify each field heuristically
    let name='', packages=1, address='', phone='', timeSlot='', cash=false, note='';

    parts.forEach(p=>{
      // Phone: starts with 04, 1300, +61, or is 8-10 digits
      if(/^(04\d{8}|1[38]\d{8}|\+61\d{9}|\d{8,10})$/.test(p.replace(/\s/g,''))){
        phone=p; return;
      }
      // Packages: number followed by 件/boxes/pcs or just standalone small number
      if(/^(\d+)\s*(件|箱|pcs|boxes?)?$/i.test(p)){
        const m=p.match(/^(\d+)/);
        if(m)packages=parseInt(m[1]);
        return;
      }
      // Cash: contains 现金/cash
      if(/现金|cash/i.test(p)){cash=true;return;}
      // Time slot: contains 点|时|am|pm|上午|下午|早|晚|随时|anytime or colon pattern
      if(/[点时]|am|pm|上午|下午|早上|晚上|随时|anytime|:/i.test(p)&&p.length<20){
        timeSlot=p;return;
      }
      // Address: contains road/street/ave/drive/place/way/rd/st/dr/vic/nsw or number+word
      if(/\d.*\s(rd|st|ave|dr|pl|way|crt|ct|lane|ln|blvd|hwy|street|road|avenue|drive|place|court|close|rise|grove|crescent|circuit)\b|\bvic\b|\bnsw\b|\bqld\b|\bsa\b|\bsuburb\b/i.test(p)||/\d{1,4}\s+\w+\s+(rd|st|ave|dr|pl|way|ct|lane|blvd|street|road|avenue|drive|place|court)\b/i.test(p)){
        address=p;return;
      }
      // Transfer payment keywords (not cash)
      if(/转账|transfer|bank|eft|online|paid|已付/i.test(p)){return;}
      // If name not set and it's short (<=15 chars), use as name
      if(!name&&p.length<=20&&!/\d{3,}/.test(p)){name=p;return;}
      // Otherwise might be note
      if(note.length<50)note+=(note?' ':'')+ p;
    });

    if(!name){name=parts[0];}
    if(!address&&parts.length>=3){
      // find the longest part that looks like address
      address=parts.reduce((best,p)=>p.length>best.length&&p!==name&&!phone.includes(p)?p:best,'');
    }
    if(name&&address){
      arr.push({name,packages,address,phone,timeSlot,cash,note});
    }
  });

  if(!arr.length){
    ss('⚠️ 无法解析，请检查格式或改用手动填写','e');
    toast('解析失败，请尝试手动填写','e');
    return;
  }
  runRoute(arr);
}

function hav(a,b){
  const R=6371,dlat=(b[0]-a[0])*Math.PI/180,dlng=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dlat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dlng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function totalDist(route){
  if(!route.length)return 0;
  let d=hav(WH_LL,route[0].ll);
  for(let i=0;i<route.length-1;i++)d+=hav(route[i].ll,route[i+1].ll);
  return d+hav(route[route.length-1].ll,WH_LL);
}

function optimize(arr){
  // Add coordinates
  const nodes=arr.map(d=>({...d,ll:getLL(d.address)}));
  // Nearest-neighbour seed
  let unvisited=[...nodes],route=[],cur=WH_LL;
  while(unvisited.length){
    const best=unvisited.reduce((b,n,i)=>hav(cur,n.ll)<hav(cur,b.n.ll)?{n,i}:b,{n:unvisited[0],i:0});
    route.push(best.n);cur=best.n.ll;unvisited.splice(best.i,1);
  }
  // 2-opt
  let imp=true,passes=0;
  while(imp&&passes<500){
    imp=false;passes++;
    for(let i=0;i<route.length-1;i++){
      for(let k=i+1;k<route.length;k++){
        const c=[...route.slice(0,i),...route.slice(i,k+1).reverse(),...route.slice(k+1)];
        if(totalDist(c)<totalDist(route)-0.001){route=c;imp=true;}
      }
    }
  }
  return route;
}

function runRoute(arr){
  ss('计算最短路线...');
  setTimeout(()=>{
    try{
      const route=optimize(arr);
      deliveries=route;
      renderTable();
      const pkgs=deliveries.reduce((s,d)=>s+d.packages,0);
      const cash=deliveries.filter(d=>d.cash).length;
      const km=totalDist(deliveries).toFixed(1);
      document.getElementById('stn').textContent=deliveries.length;
      document.getElementById('stk').textContent=pkgs;
      document.getElementById('stc').textContent=cash;
      document.getElementById('stkm').textContent=km;
      document.getElementById('rcard').style.display='block';
      ss('✅ 路线优化完成，'+deliveries.length+'单 / '+pkgs+'件 / 约'+km+'km');
      toast('路线已优化！'+deliveries.length+'单');
    }catch(e){
      ss('❌ 出错：'+e.message);
    }
  },50);
}

async function loadHist(){
  const l=document.getElementById('hlist');
  l.innerHTML='<div style="padding:20px;text-align:center;color:var(--mu)">加载中...</div>';
  try{
    const ss=await dba();
    if(!ss.length){l.innerHTML='<div style="text-align:center;padding:50px 20px;color:var(--mu)"><div style="font-size:36px;margin-bottom:10px">🕐</div>暂无历史记录</div>';return;}
    l.innerHTML='';
    ss.forEach(s=>{
      const stops=s.stops||[];
      const done=stops.filter(x=>x.done).length,total=stops.length;
      const pkgs=stops.reduce((a,x)=>a+x.packages,0);
      const csh=stops.filter(x=>x.cash).length;
      const camt=stops.reduce((a,x)=>a+(x.cash?(parseFloat(x.cashCollected)||0):0),0);
      const photos=stops.reduce((a,x)=>a+(x.photos?x.photos.length:0),0);
      const d=document.createElement('div');d.className='hi';
      d.innerHTML=`<div style="display:flex;justify-content:space-between"><b>📅 ${esc(s.date)}</b><span style="font-size:12px;color:${done===total?'var(--gn)':'var(--yw)'}">${done}/${total} 送达</span></div>
        <div style="font-size:12px;color:var(--mu);margin-top:4px;line-height:1.8">👤 ${esc(s.driver)} &nbsp;|&nbsp; 📦 ${total}单/${pkgs}件${csh?` &nbsp;|&nbsp; 💰 现金${csh}单${camt>0?' · <b style="color:var(--yw)">$'+camt.toFixed(2)+'</b>':''}` :''}${photos?` &nbsp;|&nbsp; 📷 ${photos}张`:''}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">${stops.slice(0,5).map(x=>`<span class="tag">${esc(x.name)}</span>`).join('')}${stops.length>5?`<span class="tag">+${stops.length-5}</span>`:''}</div>`;
      d.addEventListener('click',()=>openDetail(s));
      l.appendChild(d);
    });
  }catch(e){l.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--mu)">加载失败</div>';}
}

function openDetail(s){
  document.getElementById('dovt').textContent=s.date+' · '+s.driver;
  const c=document.getElementById('dovc');c.innerHTML='';
  const stops=s.stops||[];
  // Cash banner
  const cs=stops.filter(x=>x.cash);
  if(cs.length){
    const ta=cs.reduce((a,x)=>a+(parseFloat(x.cashCollected)||0),0);
    const rec=cs.filter(x=>parseFloat(x.cashCollected)>0).length;
    const b=document.createElement('div');b.style.cssText='margin:9px 13px 0';
    b.innerHTML=`<div class="cs"><div style="font-size:26px">💰</div><div><div style="font-size:12px;color:var(--mu)">当天现金收取总额</div><div style="font-size:24px;font-weight:800;color:var(--yw)">$${ta.toFixed(2)}</div><div style="font-size:11px;color:var(--mu)">已记录 ${rec}/${cs.length} 单</div></div></div>`;
    c.appendChild(b);
  }
  stops.forEach((d,i)=>{
    const el=document.createElement('div');el.className='ds';
    const photos=(d.photos||[]).map(p=>`<img style="width:75px;height:75px;object-fit:cover;border-radius:7px;border:1px solid var(--bd);cursor:pointer" src="${p}" data-src="${p}">`).join('');
    el.innerHTML=`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
      <span class="sn" style="background:${d.done?'var(--gn)':COLORS[0]}">${i+1}</span>
      <b style="font-size:15px">${esc(d.name)}</b>
      ${d.done?'<span style="margin-left:auto;font-size:12px;color:var(--gn)">✓ 送达</span>':'<span style="margin-left:auto;font-size:12px;color:var(--rd)">未送达</span>'}
    </div>
    <div style="font-size:12px;color:var(--mu);line-height:2">
      <div>📦 ${d.packages}件 &nbsp; ${d.cash?`<span class="cb">💰 ${d.cashCollected?'$'+parseFloat(d.cashCollected).toFixed(2):'未记录'}</span>`:'<span style="color:var(--mu)">无</span>'}</div>
      <div>📍 ${esc(d.address)}</div>
      <div>📞 ${esc(d.phone||'-')}</div>
      <div>⏰ ${esc(d.timeSlot||'-')}</div>
      ${d.note?`<div>📝 ${esc(d.note)}</div>`:''}
    </div>
    ${photos?`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">${photos}</div>`:'<div style="font-size:12px;color:var(--mu);margin-top:7px">📷 无照片</div>'}`;
    el.querySelectorAll('img[data-src]').forEach(img=>img.addEventListener('click',()=>olb(img.dataset.src)));
    c.appendChild(el);
  });
  document.getElementById('dov').classList.add('op');
}
function cdov(){document.getElementById('dov').classList.remove('op');}

// MISC
// ══════════════════════════════
function olb(src){document.getElementById('lbimg').src=src;document.getElementById('lb').classList.add('op');}
function clb(){document.getElementById('lb').classList.remove('op');}

function copySheet(){
  const date=document.getElementById('ddate').value;
  let t=`🚚 环球伙拼送货单 ${date} · 司机：${driverName}\n${'─'.repeat(36)}\n\n`;
  deliveries.forEach((d,i)=>{t+=`【${i+1}】${d.name} 📦${d.packages}件${d.cash?' 💰现金':''}\n  📍 ${d.address}\n  📞 ${d.phone||'-'} ⏰ ${d.timeSlot||'-'}\n\n`;});
  const pkgs=deliveries.reduce((s,d)=>s+d.packages,0),cash=deliveries.filter(d=>d.cash).length;
  t+=`${'─'.repeat(36)}\n合计：${deliveries.length}单/${pkgs}件/现金${cash}单`;
  navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>toast('复制失败','e'));
}
function clearAll(){
  deliveries=[];document.getElementById('rawtxt').value='';
  document.getElementById('rcard').style.display='none';
  document.getElementById('rtbl').innerHTML='';
  session=null;ss('请录入客户信息...');
}

function ss(msg){
  const b=document.getElementById('sb');
  if(msg.startsWith('✅'))b.innerHTML=`<span style="color:var(--gn)">●</span> ${msg.slice(2)}`;
  else if(msg.startsWith('❌'))b.innerHTML=`<span style="color:var(--rd)">●</span> ${msg.slice(2)}`;
  else b.textContent=msg;
}

let tt;
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=(type==='e'?'✗ ':'✓ ')+msg;
  el.classList.add('on');clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('on'),2500);
}
