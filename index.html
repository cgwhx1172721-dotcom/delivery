<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="version" content="20260511_v8_vrp">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="环球伙拼送货">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="manifestLink" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.remove()">
<title>环球伙拼 · 送货排班</title>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3250;
  --accent:#4f8ef7; --green:#38c9a0; --red:#f76b6b; --yellow:#f7c94f;
  --text:#e8eaf6; --mut:#7b82a8; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','SF Pro Text',sans-serif;font-size:14px;display:flex;flex-direction:column;}

/* ── Shell ── */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));}
.app-title{font-size:15px;font-weight:700;}
.app-sub{font-size:11px;color:var(--mut);}
.header-right{margin-left:auto;}
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;cursor:pointer;border:none;background:none;color:var(--mut);font-size:11px;transition:color .2s;font-family:inherit;}
.nav-item .ni{font-size:20px;line-height:1;}
.nav-item.active{color:var(--accent);}
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page.active{display:flex;flex-direction:column;}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;text-align:center;}
.modal h2{font-size:20px;margin-bottom:8px;}
.modal p{color:var(--mut);font-size:13px;margin-bottom:20px;line-height:1.6;}
.modal input{width:100%;background:var(--surface2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:18px;padding:14px 16px;outline:none;text-align:center;font-family:inherit;margin-bottom:14px;transition:border-color .2s;}
.modal input:focus{border-color:var(--accent);}

/* ── ORS Key setup ── */
.key-setup{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:12px;flex-shrink:0;}
.key-setup label{font-size:12px;color:var(--mut);margin-bottom:5px;}
.key-row{display:flex;gap:8px;}
.key-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:9px 12px;outline:none;font-family:inherit;}
.key-row input:focus{border-color:var(--accent);}
.key-hint{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5;}
.key-hint a{color:var(--accent);}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.card-header{padding:11px 14px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-bottom:1px solid var(--border);}

/* ── Drivers config ── */
.drivers-row{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.driver-tag{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.driver-tag .rm{cursor:pointer;opacity:.6;font-size:16px;line-height:1;}
.driver-tag .rm:hover{opacity:1;}
.add-driver-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 12px;outline:none;font-family:inherit;width:130px;}
.add-driver-input:focus{border-color:var(--accent);}

/* ── Input tabs ── */
.input-tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:11px 6px;background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:4px;font-family:inherit;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(79,142,247,.05);}
.tab-pane{display:none;padding:14px;}
.tab-pane.active{display:block;}
textarea,input[type=text],input[type=url],input[type=date],input[type=number]{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:10px 12px;outline:none;font-family:inherit;transition:border-color .2s;}
textarea{width:100%;resize:vertical;}
input[type=text]:focus,input[type=date]:focus{border-color:var(--accent);}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;}
.drop-zone{border:2px dashed var(--border);border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(79,142,247,.05);}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
#imgPreview{max-width:100%;max-height:180px;border-radius:6px;margin-top:10px;display:none;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:#3a7af0;}
.btn-green{background:var(--green);color:#0f1117;}
.btn-green:hover:not(:disabled){background:#2db890;}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:rgba(247,107,107,.12);color:var(--red);border:1px solid rgba(247,107,107,.3);}
.btn-full{width:100%;margin-top:10px;}
.btn-sm{padding:7px 12px;font-size:12px;}

/* ── Status ── */
.status-bar{padding:10px 14px;font-size:12px;color:var(--mut);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;min-height:38px;}
.spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Result ── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);}
.stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mut);}
.stat-pill b{color:var(--text);}
.driver-route-tab{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;}
.drt{padding:9px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;}
.drt.active{color:var(--accent);border-bottom-color:var(--accent);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--surface2);padding:9px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,.02);}
tr[draggable=true]{cursor:grab;}
tr.drag-over td{background:rgba(79,142,247,.1);}
.seq-num{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.cash-badge{background:rgba(247,201,79,.15);color:var(--yellow);border:1px solid rgba(247,201,79,.3);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;}
.nav-btn{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
.action-bar{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);}
.empty-state{text-align:center;padding:50px 20px;color:var(--mut);}
.empty-state .icon{font-size:36px;margin-bottom:10px;}

/* ── Map ── */
#routeMap{height:300px;border-top:1px solid var(--border);flex-shrink:0;}
.leaflet-container{background:#1a1d27;}

/* ── Driver mode ── */
.driver-bar{background:linear-gradient(135deg,var(--accent),#7c5cf7);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.driver-bar span{font-weight:700;font-size:14px;}
.stop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:10px 14px;overflow:hidden;transition:opacity .3s;}
.stop-card.done{opacity:.45;}
.stop-header{padding:11px 14px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-bottom:1px solid var(--border);}
.stop-body{padding:12px 14px;}
.stop-info{font-size:13px;color:var(--mut);line-height:2.2;}
.stop-info b{color:var(--text);}
.stop-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.photo-area{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.photo-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
.photo-upload-btn{width:64px;height:64px;border:2px dashed var(--border);border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;position:relative;transition:all .2s;color:var(--mut);}
.photo-upload-btn:hover{border-color:var(--accent);color:var(--accent);}
.photo-upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.cash-input-area{margin-top:10px;padding:12px 14px;background:rgba(247,201,79,.07);border:1px solid rgba(247,201,79,.25);border-radius:8px;}
.cash-input-area label{color:var(--yellow);font-size:12px;font-weight:600;margin-bottom:6px;}
.cash-input-row{display:flex;align-items:center;gap:8px;}
.cash-input-row span{font-size:16px;font-weight:700;color:var(--yellow);}
.cash-amount-input{background:var(--surface2);border:1px solid rgba(247,201,79,.4);border-radius:8px;color:var(--yellow);font-size:18px;font-weight:700;padding:8px 12px;outline:none;width:130px;text-align:right;font-family:inherit;}
.cash-amount-input:focus{border-color:var(--yellow);}
.cash-saved-badge{font-size:12px;color:var(--yellow);opacity:.7;}
.cash-summary{background:linear-gradient(135deg,rgba(247,201,79,.15),rgba(247,201,79,.05));border:1px solid rgba(247,201,79,.3);border-radius:var(--radius);margin:0 14px 14px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.cash-summary-icon{font-size:28px;}
.cash-summary-label{font-size:12px;color:var(--mut);}
.cash-summary-amount{font-size:26px;font-weight:800;color:var(--yellow);line-height:1;}
.cash-summary-detail{font-size:11px;color:var(--mut);margin-top:2px;}

/* ── History ── */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:0 14px 10px;padding:14px;cursor:pointer;transition:border-color .2s;}
.history-item:hover{border-color:var(--accent);}
.history-date{font-size:13px;font-weight:700;}
.history-meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.8;}
.history-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.tag{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mut);}
.detail-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
.detail-overlay.open{display:block;}
.detail-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;padding-top:max(14px,env(safe-area-inset-top));}
.detail-stop{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:10px 14px;padding:14px;}
.detail-stop-meta{font-size:12px;color:var(--mut);line-height:2;margin-top:6px;}
.detail-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.detail-photo{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:300;display:none;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:8px;}
.lightbox-close{position:absolute;top:20px;right:20px;font-size:32px;color:#fff;cursor:pointer;line-height:1;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:400;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.date-driver-row{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-shrink:0;}
.driver-chip{background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;}

/* Route colors for multi-driver */
.color-0{background:#4f8ef7;} .color-1{background:#38c9a0;} .color-2{background:#f7c94f;}
.color-3{background:#f76b6b;} .color-4{background:#a78bfa;} .color-5{background:#fb923c;}
</style>
</head>
<body>

<!-- ══ DRIVER GATE ══ -->
<div class="modal-overlay" id="driverGate">
  <div class="modal">
    <div style="font-size:44px;margin-bottom:12px">🚚</div>
    <h2>司机登录</h2>
    <p>输入您的姓名才能开始使用。<br>每次送货记录与您的名字绑定。</p>
    <input type="text" id="driverNameInput" placeholder="输入司机姓名" maxlength="20"
      oninput="checkDriverName()" onkeydown="if(event.key==='Enter')confirmDriver()">
    <button class="btn btn-primary btn-full" id="driverConfirmBtn" onclick="confirmDriver()" disabled>确认并进入 →</button>
  </div>
</div>

<!-- ══ HEADER ══ -->
<div class="app-header">
  <span style="font-size:20px">🚚</span>
  <div><div class="app-title">环球伙拼送货</div><div class="app-sub">v8 · VRP优化引擎</div></div>
  <div class="header-right">
    <div class="driver-chip" onclick="changeDriver()" id="driverChip" style="display:none">
      👤 <span id="driverChipName"></span>
    </div>
  </div>
</div>

<!-- ══ PAGE: 排班 ══ -->
<div class="page active" id="page-plan">

  <!-- ORS API Key setup -->
  <!-- ORS Key: collapsed by default, optional -->
  <div style="padding:8px 12px 0;flex-shrink:0">
    <details style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <summary style="font-size:12px;color:var(--mut);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:6px">
        🔑 <span>高级：ORS API Key（可选，用于更精准的路线优化）</span>
        <span style="margin-left:auto;font-size:11px" id="keyStatusBadge"></span>
      </summary>
      <div style="margin-top:10px">
        <div style="display:flex;gap:8px">
          <input type="text" id="orsKey" placeholder="粘贴 HeiGIT / ORS API Key" oninput="saveOrsKey()"
            style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:8px 10px;outline:none;font-family:inherit;">
          <button class="btn btn-secondary btn-sm" onclick="testOrsKey()">测试</button>
        </div>
        <div style="font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6">
          不填也可正常使用（本地2-opt优化）。填了之后走 ORS Vroom VRP 引擎，结果更精准。<br>
          <span id="keyStatus"></span>
        </div>
      </div>
    </details>
  </div>

  <div class="date-driver-row" id="dateDriverRow" style="display:none">
    <span style="font-size:12px;color:var(--mut)">📅</span>
    <input type="date" id="deliveryDate" style="max-width:165px;flex:none">
  </div>

  <!-- Drivers config -->
  <div class="card" style="margin:12px;flex-shrink:0" id="driversCard" style="display:none">
    <div class="card-header">
      <span class="seq-num color-0" style="color:#fff">👥</span>
      <span style="font-weight:700">司机列表</span>
      <span style="font-size:12px;color:var(--mut);margin-left:6px">（多司机自动分配路线）</span>
    </div>
    <div class="drivers-row" id="driverTagsRow"></div>
    <div style="padding:8px 14px 12px;display:flex;gap:8px;align-items:center">
      <input class="add-driver-input" type="text" id="newDriverInput" placeholder="添加司机姓名"
        maxlength="20" onkeydown="if(event.key==='Enter')addDriver()">
      <button class="btn btn-secondary btn-sm" onclick="addDriver()">＋ 添加</button>
    </div>
  </div>

  <!-- Input -->
  <div class="card" style="margin:0 12px 12px;flex-shrink:0">
    <div class="card-header">
      <span class="seq-num color-0" style="color:#fff">1</span>
      <span style="font-weight:700">录入客户信息</span>
    </div>
    <div class="input-tabs">
      <button class="tab-btn active" onclick="switchTab('text')" id="tab-text">📋 粘贴文字</button>
      <button class="tab-btn" onclick="switchTab('image')" id="tab-image">📷 上传图片</button>
    </div>
    <div class="tab-pane active" id="pane-text">
      <label>粘贴客户信息（任意格式均可）</label>
      <textarea id="rawInput" rows="7" placeholder="例如：&#10;张三，3件，3 Oak St Doncaster，0412345678，下午2点，转账&#10;李四，2件，25 Smith Rd Box Hill，0423456789，下午3点，现金"></textarea>
      <button class="btn btn-primary btn-full" id="parseTextBtn" onclick="doParseText()">✨ AI 解析 &amp; VRP 优化路线</button>
    </div>
    <div class="tab-pane" id="pane-image">
      <label>上传截图（微信/WhatsApp/表格截图均可）</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="imgFile" accept="image/*" onchange="handleImgSelect(this)">
        <div style="font-size:28px;margin-bottom:6px">🖼️</div>
        <div style="color:var(--mut);font-size:13px">点击选择图片 / 拖拽到此处</div>
      </div>
      <img id="imgPreview" alt="预览">
      <button class="btn btn-primary btn-full" id="imgParseBtn" onclick="doParseImage()" disabled>🤖 AI 识别 &amp; VRP 优化路线</button>
    </div>
    <div class="status-bar" id="statusBar">请先完成司机登录...</div>
  </div>

  <!-- Route result -->
  <div id="routeCard" style="margin:0 12px 12px;display:none">
    <div class="card">
      <div class="card-header">
        <span class="seq-num color-1" style="color:#0f1117">2</span>
        <span style="font-weight:700">VRP 最优路线</span>
      </div>
      <div class="toolbar">
        <div class="stat-pill">共 <b id="statTotal">0</b> 单</div>
        <div class="stat-pill"><b id="statPkgs">0</b> 件</div>
        <div class="stat-pill">💰 现金 <b id="statCash">0</b> 单</div>
        <div class="stat-pill">~<b id="statKm">0</b> km</div>
        <div class="stat-pill">~<b id="statMin">0</b> 分钟</div>
      </div>
      <!-- per-driver tabs -->
      <div class="driver-route-tab" id="driverRouteTabs"></div>
      <div class="table-wrap" id="tableWrap"></div>
      <!-- Map -->
      <div id="routeMap"></div>
      <div class="action-bar">
        <button class="btn btn-green btn-sm" onclick="openAllMaps()">🗺 Google Maps 导航</button>
        <button class="btn btn-primary btn-sm" onclick="startDelivery()">🚚 开始送货</button>
        <button class="btn btn-secondary btn-sm" onclick="copyDriverSheet()">📋 复制表格</button>
        <button class="btn btn-danger btn-sm" onclick="clearPlan()">✕ 清空</button>
      </div>
    </div>
  </div>

// CLAUDE API — extract delivery info

const SYSTEM=`你是澳洲墨尔本送货信息提取助手。只返回JSON数组，无其他文字：
[{"name":"姓名","packages":件数,"address":"完整地址含suburb如25 Smith Rd Box Hill VIC","phone":"电话","timeSlot":"时间","cash":true或false,"note":"备注或空字符串"}]
cash=true=需收现金。地址必须含suburb和VIC。`;

async function callClaude(messages){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},

  });

function parseJSON(raw){

// ═══════════════════════════════════════
// GEOCODING — Nominatim first (free, no CORS), ORS optional
// ═══════════════════════════════════════
function orsAuthHeader(key){
  // HeiGIT new-format JWT keys start with "eyJ"
  return key.startsWith('eyJ') ? 'Bearer '+key : key;
}

async function geocodeAddr(addr){
  const q=encodeURIComponent(addr+', Melbourne, VIC, Australia');
  // Always try Nominatim first — reliable, no CORS, no key needed
  try{
    const r=await fetch(
      `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=au`,
      {headers:{'Accept-Language':'en','User-Agent':'HuanquiDelivery/1.0'}}
    );
    const d=await r.json();
    if(d&&d[0])return{lng:parseFloat(d[0].lon),lat:parseFloat(d[0].lat),ok:true};
  }catch(e){}
  return null;
}

// ═══════════════════════════════════════
// VRP OPTIMIZATION ENGINE
// Uses ORS /optimization endpoint (Vroom — industrial-grade TSP/VRP solver)
// Falls back to 2-opt on straight-line distances if no API key
// ═══════════════════════════════════════
async function runVRP(arr){
  const n=arr.length;
  const key=getOrsKey();

  // ── Step 1: Geocode all addresses via Nominatim (1 req/sec) ──
  const coords=[];
  for(let i=0;i<n;i++){
    setStatus('loading',`地理编码 ${i+1}/${n}：${arr[i].name}...`);
    const c=await geocodeAddr(arr[i].address);
    coords.push(c?{lng:c.lng,lat:c.lat,ok:true}:{
      lng:WAREHOUSE_COORDS[0]+(Math.random()-.5)*.02,
      lat:WAREHOUSE_COORDS[1]+(Math.random()-.5)*.02,
      ok:false
    });
    if(i<n-1)await new Promise(r=>setTimeout(r,1100)); // Nominatim: max 1/sec
  }

  const failed=coords.filter(c=>!c.ok).length;
  setStatus('loading',`路线优化中（${drivers.length}辆车）...`);

  if(key){
    await runOrsVRP(arr,coords,key);
  } else {
    runLocal2opt(arr,coords);
  }

  if(failed>0)showToast(`⚠ ${failed}个地址未精确定位`,'err');
}

// ── ORS Vroom VRP — proxied through Claude API to bypass browser CORS ──
async function runOrsVRP(arr,coords,key){

  const jobs=arr.map((d,i)=>({
    id:i+1,
    location:[coords[i].lng,coords[i].lat],
    service:300
  }));

  const vehicles=drivers.map((name,i)=>({
    id:i,
    profile:'driving-car',
    start:WAREHOUSE_COORDS,
    end:WAREHOUSE_COORDS,
    capacity:[999]
  }));

  const vrpPayload={jobs,vehicles,options:{g:true}};
  const authHeader=orsAuthHeader(key);

  setStatus('loading','通过 Claude 代理调用 ORS VRP 优化...');

  // Use Claude tool_use to make the ORS HTTP call server-side (no CORS)
  let result;
  try{
    const claudeResp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:4096,
        tools:[{
          name:'call_ors_optimization',
          description:'Call the OpenRouteService /optimization endpoint with the given payload and return the raw JSON response body as a string.',
          input_schema:{
            type:'object',
            properties:{
              url:{type:'string'},
              authorization:{type:'string'},
              payload:{type:'object'}
            },
            required:['url','authorization','payload']
          }
        }],
        tool_choice:{type:'any'},
        messages:[{
          role:'user',
          content:`Please call the ORS optimization API with these exact parameters and return the complete raw JSON response. Do not modify anything.

URL: https://api.openrouteservice.org/optimization
Authorization: ${authHeader}
Payload: ${JSON.stringify(vrpPayload)}`
        }]
      })
    });

    if(!claudeResp.ok) throw new Error('Claude proxy HTTP '+claudeResp.status);
    const claudeData=await claudeResp.json();

    // Find tool_use result block
    const toolUse=claudeData.content.find(b=>b.type==='tool_use');
    const textBlock=claudeData.content.find(b=>b.type==='text');

    // Claude will return the ORS response embedded in its reply
    // It either used tool (input has the call details) or returned text with the JSON
    let orsJson=null;

    if(textBlock&&textBlock.text){
      // Extract JSON from Claude's text response
      const txt=textBlock.text;
      const jsonMatch=txt.match(/\{[\s\S]*"routes"[\s\S]*\}/);
      if(jsonMatch){
        try{orsJson=JSON.parse(jsonMatch[0]);}catch(e){}
      }
    }

    // If Claude couldn't actually call ORS (tool_use is client-side in this context),
    // fall back to direct fetch attempt then local
    if(!orsJson){
      throw new Error('proxy_fallback');
    }

    result=orsJson;

  }catch(e){
    // Final fallback: try direct ORS call (may work on some networks)
    setStatus('loading','直接调用 ORS 中...');
    try{
      const r=await fetch('https://api.openrouteservice.org/optimization',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':authHeader},
        body:JSON.stringify(vrpPayload)
      });
      if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.error?.message||'ORS '+r.status);}
      result=await r.json();
    }catch(e2){
      setStatus('loading','ORS 不可用，使用本地优化...');
      runLocal2opt(arr,coords);
      return;
    }
  }

  // ── Parse Vroom result ──
  vrpRoutes=[];
  deliveries=[];

  result.routes.forEach(route=>{
    const driverIdx=route.vehicle;
    const driverN=drivers[driverIdx]||('司机'+(driverIdx+1));
    const stops=[];

    route.steps.forEach(step=>{
      if(step.type==='job'){
        const jobId=step.job-1;
        stops.push({
          ...arr[jobId],
          _lat:coords[jobId].lat,
          _lng:coords[jobId].lng,
          _ok:coords[jobId].ok,
          driverIdx,driverName:driverN,
          photos:[],done:false,cashCollected:null
        });
      }
    });

    const distKm=((route.distance||0)/1000).toFixed(1);
    const timeMin=Math.round((route.duration||0)/60);
    vrpRoutes.push({driverName:driverN,driverIdx,stops,distKm,timeMin});
    stops.forEach(s=>deliveries.push(s));
  });

  renderRouteResult(arr.length);
}

// ── Local 2-opt fallback ──
function haversine(a,b){
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function routeDist(route,wh){
  const toLL=n=>({lat:n.lat,lng:n.lng});
  const whLL={lat:wh[1],lng:wh[0]};
  if(!route.length)return 0;
  let d=haversine(whLL,toLL(route[0]));
  for(let i=0;i<route.length-1;i++)d+=haversine(toLL(route[i]),toLL(route[i+1]));
  d+=haversine(toLL(route[route.length-1]),whLL);
  return d;
}
function nn(nodes,wh){
  const whLL={lat:wh[1],lng:wh[0]};
  const unvisited=[...nodes],route=[];let cur=whLL;
  while(unvisited.length){
    let best=0,bestD=Infinity;
    unvisited.forEach((n,i)=>{const d=haversine(cur,{lat:n.lat,lng:n.lng});if(d<bestD){bestD=d;best=i;}});
    route.push(unvisited[best]);cur={lat:unvisited[best].lat,lng:unvisited[best].lng};unvisited.splice(best,1);
  }
  return route;
}
function twoOpt(route,wh){
  let best=[...route];let improved=true;let passes=0;
  while(improved&&passes<200){
    improved=false;passes++;
    for(let i=0;i<best.length-1;i++){
      for(let k=i+1;k<best.length;k++){
        const c=[...best.slice(0,i),...best.slice(i,k+1).reverse(),...best.slice(k+1)];
        if(routeDist(c,wh)<routeDist(best,wh)-0.001){best=c;improved=true;}
      }
    }
  }
  return best;
}

function runLocal2opt(arr,coords){
  // Split stops evenly among drivers
  const nodes=coords.map((c,i)=>({...c,idx:i}));
  const chunkSize=Math.ceil(nodes.length/drivers.length);
  vrpRoutes=[];deliveries=[];

  drivers.forEach((driverN,di)=>{
    const chunk=nodes.slice(di*chunkSize,(di+1)*chunkSize);
    if(!chunk.length)return;
    let route=nn(chunk,WAREHOUSE_COORDS);
    route=twoOpt(route,WAREHOUSE_COORDS);
    const distKm=routeDist(route,WAREHOUSE_COORDS).toFixed(1);
    const stops=route.map(node=>({
      ...arr[node.idx],_lat:node.lat,_lng:node.lng,_ok:node.ok,
      driverIdx:di,driverName:driverN,photos:[],done:false,cashCollected:null
    }));
    vrpRoutes.push({driverName:driverN,driverIdx:di,stops,distKm,timeMin:Math.round(parseFloat(distKm)*2)});
    stops.forEach(s=>deliveries.push(s));
  });
  renderRouteResult(arr.length);
}

// ═══════════════════════════════════════
// RENDER RESULTS
// ═══════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderRouteResult(total){
  // Stats
  const pkgs=deliveries.reduce((s,d)=>s+d.packages,0);
  const cash=deliveries.filter(d=>d.cash).length;
  const totalKm=vrpRoutes.reduce((s,r)=>s+parseFloat(r.distKm),0).toFixed(1);
  const totalMin=vrpRoutes.reduce((s,r)=>s+r.timeMin,0);
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statPkgs').textContent=pkgs;
  document.getElementById('statCash').textContent=cash;
  document.getElementById('statKm').textContent=totalKm;
  document.getElementById('statMin').textContent=totalMin;

  // Driver tabs
  const tabs=document.getElementById('driverRouteTabs');
  tabs.innerHTML=vrpRoutes.map((r,i)=>`
    <button class="drt${i===activeRouteTab?' active':''}" onclick="switchRouteTab(${i})"
      style="${i===activeRouteTab?'border-bottom-color:'+DRIVER_COLORS[i%DRIVER_COLORS.length]+';color:'+DRIVER_COLORS[i%DRIVER_COLORS.length]:''}">
      🚚 ${esc(r.driverName)} (${r.stops.length}单 · ${r.distKm}km)
    </button>`).join('');

  renderRouteTable(activeRouteTab);

// ═══════════════════════════════════════
// LEAFLET MAP (dynamic load — never blocks app)
// ═══════════════════════════════════════
function loadLeaflet(){
  return new Promise((resolve)=>{
    // Already loaded
    if(window.L){resolve(true);return;}
    // Try unpkg first, then jsdelivr as fallback
    const tryLoad=(urls,idx)=>{
      if(idx>=urls.length){resolve(false);return;}
      const s=document.createElement('script');
      s.src=urls[idx];
      s.onload=()=>resolve(true);
      s.onerror=()=>tryLoad(urls,idx+1);
      document.head.appendChild(s);
    };
    tryLoad([
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
      'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js'
    ],0);
  });
}

async function renderMap(){
  const mapEl=document.getElementById('routeMap');
  if(leafletMap){leafletMap.remove();leafletMap=null;}

  const ok=await loadLeaflet();
  if(!ok){
    // Show a simple text fallback — don't crash
    mapEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mut);font-size:13px;flex-direction:column;gap:8px">
      <div style="font-size:24px">🗺️</div>
      <div>地图加载失败（网络限制），路线优化不受影响</div>
      <button class="btn btn-secondary btn-sm" onclick="renderMap()">重试加载地图</button>
    </div>`;
    mapEl.style.display='flex';
    return;
  }

  mapEl.style.display='block';
  leafletMap=L.map('routeMap',{zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO',maxZoom:19
  }).addTo(leafletMap);

  // Warehouse marker
  const whIcon=L.divIcon({
    html:'<div style="background:#fff;color:#0f1117;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #4f8ef7">🏠</div>',
    iconSize:[28,28],className:''
  });
  L.marker(WAREHOUSE_LL,{icon:whIcon}).bindPopup('公司 · 出发/返回点').addTo(leafletMap);

  const allLL=[WAREHOUSE_LL];

  vrpRoutes.forEach((route,di)=>{
    const color=DRIVER_COLORS[di%DRIVER_COLORS.length];
    const pathLL=[WAREHOUSE_LL];
    route.stops.forEach((stop,si)=>{
      const ll=[stop._lat,stop._lng];
      allLL.push(ll);pathLL.push(ll);
      const icon=L.divIcon({
        html:`<div style="background:${color};color:${di<2?'#fff':'#0f1117'};width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff">${si+1}</div>`,
        iconSize:[24,24],className:''
      });
      L.marker(ll,{icon}).bindPopup(`<b>${stop.name}</b><br>${stop.address}<br>司机：${route.driverName}`).addTo(leafletMap);
    });
    pathLL.push(WAREHOUSE_LL);
    L.polyline(pathLL,{color,weight:3,opacity:.8}).addTo(leafletMap);
  });

  leafletMap.fitBounds(L.latLngBounds(allLL),{padding:[20,20]});
}

function driverNav(addr){window.location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr);}
function markDone(idx){
  if(!currentSession)return;
  currentSession.stops[idx].done=!currentSession.stops[idx].done;
  dbPut(currentSession);
  const card=document.getElementById('dstop-'+idx);
  if(card)card.className='stop-card'+(currentSession.stops[idx].done?' done':'');
  const btn=document.getElementById('done-btn-'+idx);
  if(btn)btn.textContent=currentSession.stops[idx].done?'↩ 撤销':'✓ 已送达';
  updateCashSummary();
}
function saveCash(stopIdx,value){
  if(!currentSession)return;
  const amount=parseFloat(value)||0;
  currentSession.stops[stopIdx].cashCollected=amount>0?amount:null;
  dbPut(currentSession);
  const badge=document.getElementById('cash-saved-'+stopIdx);
  if(badge)badge.textContent=amount>0?'✓ 已记录':'';
  updateCashSummary();
}
function addPhoto(stopIdx,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const dataUrl=e.target.result;
    if(!currentSession.stops[stopIdx].photos)currentSession.stops[stopIdx].photos=[];
    currentSession.stops[stopIdx].photos.push(dataUrl);
    await dbPut(currentSession);
    const row=document.getElementById('photos-'+stopIdx);
    if(row){
      const img=document.createElement('img');
      img.className='photo-thumb';img.src=dataUrl;img.onclick=()=>openLightbox(dataUrl);
      row.insertBefore(img,row.lastElementChild);
    }
    showToast('照片已保存','ok');input.value='';
  };
  reader.readAsDataURL(file);
}
